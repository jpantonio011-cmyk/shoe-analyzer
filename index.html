<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Shoe Analyzer · Oxford AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h1>👟 Shoe Analyzer</h1>
    <div class="subhead">Upload or capture a shoe photo to get the brand, size, details, and estimated price in PHP.</div>

    <!-- Upload & Camera Area -->
    <div class="upload-area" id="dropZone">
      <div class="action-buttons">
        <label for="fileInput" class="file-input-label">
          <span>📸</span> Upload Photo
        </label>
        <button type="button" class="btn-camera" id="openCameraBtn">
          <span>📷</span> Open Camera
        </button>
      </div>
      
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/gif,image/webp" />
      
      <div class="preview-row">
        <div id="previewContainer" class="preview-placeholder">👟</div>
      </div>
    </div>

    <!-- Camera View (Hidden by default) -->
    <div class="camera-view" id="cameraView" style="display: none;">
      <video id="cameraStream" autoplay playsinline></video>
      <div class="camera-controls">
        <button class="btn-secondary" id="closeCameraBtn">Cancel</button>
        <button class="btn-primary" id="captureBtn">📸 Capture</button>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="button-group" id="mainActions">
      <button class="btn-primary" id="analyzeBtn" disabled>
        <span>🔍</span> Analyze Shoe
      </button>
      <button class="btn-secondary" id="cancelBtn" disabled>
        ✖ Cancel
      </button>
    </div>

    <!-- Status / Loading / Error -->
    <div class="status-message" id="statusMsg"></div>

    <!-- Result Card -->
    <div class="result-card" id="resultCard" style="display: none;">
      <div class="result-title">
        <span>📋</span> Shoe Analysis
      </div>
      <div id="responseText" class="ai-response"></div>
    </div>

    <div class="footer-note">
      Oxford AI · Available in the Philippines · Max 1 image, 5MB
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
